        /* page guard: only signed-in users can open this page */

            if (!JSON.parse(localStorage.getItem("ahlia_user"))) throw 0;
        } catch (e) {
            location.replace("login.html?next=" + encodeURIComponent(location.pathname.split("/").pop()));
        }
    </script>

    <style>
        #tp {
            --panel: var(--card);
            --panel2: var(--bg-2);
            --line: var(--border);
            --tx: var(--text);
            --mut: var(--muted);
            --pri: var(--blue);
            --ok: #2fae7a;
            --warn: #b87912;
            color: var(--tx);
            font-family: Cairo, system-ui, sans-serif;
            padding: 20px 0 40px;
            * {
                box-sizing: border-box
            }
            .head {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 12px;
                margin: 16px auto 24px;
                text-align: center
            }
            h1 {
                font-size: 1.5rem;
                margin: 0
            }
            .mut {
                color: var(--mut);
                font-size: .88rem
            }
            button,
            select,
            input,
            textarea {
                font: inherit;
                color: inherit
            }
            .b {
                padding: 10px 18px;
                border-radius: 10px;
                border: 1px solid var(--line);
                background: transparent;
                cursor: pointer
            }
            .b.p {
                background: var(--pri);
                border-color: var(--pri);
                color: #fff;
                font-weight: 700
            }
            .b:focus-visible,
            .tab:focus-visible {
                outline: 2px solid var(--pri);
                outline-offset: 2px
            }
            .bar {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 10px;
                margin: 12px 0 18px;
                height: auto;
                overflow: visible;
                border-radius: 0;
                background: transparent;
                position: relative;
                z-index: 2;
                isolation: isolate
            }
            .tab {
                padding: 8px 16px;
                border-radius: 999px;
                border: 1px solid var(--line);
                background: var(--panel);
                cursor: pointer
            }
            .tab.on {
                background: var(--pri);
                border-color: var(--pri);
                color: #fff
            }
            .fld {
                padding: 9px 12px;
                border-radius: 10px;
                border: 1px solid var(--line);
                background: var(--bg);
                width: 100%;
                min-width: 0;
                max-width: 100%;
                min-height: 46px
            }
            #fq {
                grid-column: span 3
            }
            .list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
                gap: 14px
            }
            .card {
                background: linear-gradient(180deg, var(--panel), var(--panel2));
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                min-width: 0;
                overflow-wrap: anywhere
            }
            .card.closed {
                opacity: .55
            }
            .tag {
                align-self: flex-start;
                padding: 3px 12px;
                border-radius: 999px;
                font-size: .78rem;
                font-weight: 700
            }
            .tag.need {
                background: rgba(245, 158, 11, .15);
                color: var(--warn)
            }
            .tag.have {
                background: rgba(34, 197, 94, .14);
                color: var(--ok)
            }
            .tag.cl {
                background: rgba(128, 128, 128, .14);
                color: var(--mut)
            }
            .card h3 {
                margin: 0;
                font-size: 1.1rem
            }
            .chips {
                display: flex;
                gap: 6px;
                flex-wrap: wrap
            }
            .chips span {
                padding: 3px 10px;
                border-radius: 8px;
                background: var(--panel2);
                font-size: .8rem;
                overflow-wrap: anywhere
            }
            .card p {
                margin: 0;
                font-size: .9rem;
                line-height: 1.7
            }
            .foot {
                margin-top: auto;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                min-width: 0
            }
            .card__actions {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr));
                gap: 8px;
                min-width: 0
            }
            .card__actions .b {
                display: flex;
                align-items: center;
                justify-content: center;
                min-width: 0;
                min-height: 44px;
                padding: 7px 10px;
                text-decoration: none;
                color: var(--tx);
                text-align: center;
                overflow-wrap: anywhere
            }
            .contact-method {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                min-width: 0
            }
            .contact-method__label {
                color: var(--mut);
                font-size: .72rem
            }
            .empty {
                padding: 40px;
                text-align: center;
                border: 1px dashed var(--line);
                border-radius: 14px
            }
            dialog {
                position: fixed;
                inset: 0;
                margin: auto;
                background: var(--panel2);
                color: var(--tx);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 20px;
                width: min(560px, calc(100vw - 24px));
                max-height: calc(100dvh - 24px);
                overflow-y: auto
            }
            dialog::backdrop {
                background: #000a
            }
            dialog label {
                display: block;
                margin-top: 12px;
                font-size: .9rem
            }
            dialog label[hidden] {
                display: none
            }
            dialog .fld {
                width: 100%;
                margin-top: 4px
            }
            .seg2 {
                display: flex;
                gap: 8px;
                margin-top: 6px
            }
            .seg2 label {
                flex: 1;
                margin: 0;
                padding: 10px;
                border: 1px solid var(--line);
                border-radius: 10px;
                cursor: pointer;
                text-align: center
            }
            .seg2 input {
                display: none
            }
            .seg2 label:has(input:checked) {
                border-color: var(--pri);
                background: rgba(47, 123, 255, .12)
            }
            .acts {
                display: flex;
                gap: 8px;
                margin-top: 16px
            }
            .acts .b {
                flex: 1
            }
            .err {
                color: #f87171;
                font-size: .85rem;
                margin-top: 8px;
                min-height: 1.2em
            }
            .toast {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--panel2);
                color: var(--tx);
                border: 1px solid var(--pri);
                padding: 10px 16px;
                border-radius: 12px;
                display: none;
                z-index: 50
            }
        }
        
        @media (max-width: 700px) {
            #tp .bar {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }
            #tp #fq,
            #tp #clearFilters {
                grid-column: 1 / -1
            }
        }
        
        @media (max-width: 420px) {
            #tp {
                padding-top: 12px
            }
            #tp .bar {
                grid-template-columns: minmax(0, 1fr)
            }
            #tp h1 {
                font-size: 1.3rem
            }
            #tp .acts {
                flex-direction: column
            }
            #tp dialog {
                padding: 16px
            }
        }
    </style>
</head>

<body data-page="teams">

          <path d="M24 3 L44 44 L34 44 L24 22 L14 44 L4 44 Z" fill="url(#lg)"/><path d="M24 30 L30 44 L18 44 Z" fill="#a78bfa"/>

    <main id="tp" class="container">
        <div class="head">
            <div class="head__copy">
                <h1>ابحث عن تيم أو زميل مشروع</h1>
                <div class="mut">محتاج حد يشتغل معاك؟ أو معاك تيم ناقصه أعضاء؟ اكتب طلبك هنا.</div>
            </div>
            <button class="b p" id="add" type="button">إضافة طلب</button>
        </div>

        <div class="bar" role="group" aria-label="نوع الطلب">
            <select class="fld" id="ft" aria-label="نوع الطلب"><option value="">كل أنواع الطلبات</option><option value="need">محتاج تيم</option><option value="have">معايا تيم ومحتاج أعضاء</option></select>
            <select class="fld" id="fy" aria-label="السنة الدراسية"><option value="">كل السنوات</option><option>الأولى</option><option>الثانية</option><option>الثالثة</option><option>الرابعة</option></select>
            <select class="fld" id="fs" aria-label="حالة الطلب"><option value="">كل الحالات</option><option value="open">طلبات مفتوحة</option><option value="closed">طلبات مكتملة</option></select>
            <select class="fld" id="fo" aria-label="ترتيب الطلبات"><option value="newest">الأحدث أولًا</option><option value="oldest">الأقدم أولًا</option></select>
            <input class="fld" id="fq" type="search" placeholder="ابحث بالمادة أو الدور أو التفاصيل..." aria-label="بحث">
            <button class="b" id="clearFilters" type="button">مسح الفلاتر</button>
        </div>
        <p class="mut" id="cnt" aria-live="polite"></p>
        <div class="list" id="list" aria-live="polite"></div>

        <dialog id="dlg">
            <form id="frm" method="dialog">
                <h2 style="margin:0">طلب جديد</h2>
                <div class="seg2" role="radiogroup" aria-label="نوع الطلب">
                    <label><input type="radio" name="type" value="need" checked>🔎 محتاج تيم</label>
                    <label><input type="radio" name="type" value="have">👥 معايا تيم</label>
                </div>
                <label>اسم المادة / المشروع<input class="fld" name="subject" maxlength="60" required placeholder="مثال: قواعد البيانات"></label>
                <label>الدور <span class="mut" id="roleHint">(اللي إنت بتعرف تعمله)</span><input class="fld" name="role" maxlength="40" required placeholder="مثال: Frontend، تصميم، تقارير..."></label>
                <label>السنة الدراسية<select class="fld" name="year" required><option>الأولى</option><option>الثانية</option><option>الثالثة</option><option>الرابعة</option></select></label>
                <label id="majorField" hidden>التخصص<select class="fld" id="majorSelect" name="major" disabled><option value="">اختر التخصص</option><option value="cs">علوم الحاسب</option><option value="ai">الذكاء الاصطناعي</option><option value="is">نظم المعلومات</option></select></label>
                <label><span id="cntLbl">عدد أفراد التيم المطلوب</span><input class="fld" name="count" type="number" min="1" max="20" value="3" required></label>
                <label>تفاصيل (اختياري)<textarea class="fld" name="desc" rows="3" maxlength="300"></textarea></label>
                <label>وسيلة التواصل (واتساب / تيليجرام / رابط)<input class="fld" name="contact" maxlength="80" required placeholder="01xxxxxxxxx أو https://t.me/..."></label>
                <div class="err" id="err" role="alert"></div>
                <div class="acts"><button class="b p" type="submit">نشر الطلب</button><button class="b" type="button" id="cancel">إلغاء</button></div>
            </form>
        </dialog>
        <div class="toast" id="toast" role="status"></div>

    <footer class="footer">
        <div class="container footer__inner">
            <p class="footer__text">معاً نحو مستقبل أفضل &nbsp;|&nbsp; طلاب أهلية &nbsp;|&nbsp; <a href="team.html" class="footer__link">فريق العمل</a></p>
        </div>
    </footer>
    <script>
        const KEY = "ahlia_team_posts";
        const U = (() => {
            try {
                return JSON.parse(localStorage.getItem("ahlia_user")) || {}
            } catch (e) {
                return {}
            }
        })();
        const ME = {
            id: String(U.id || "guest"),
            name: U.name || "طالب"
        };
        const api = (m, u, b) => AhliaStore.api(m, u, b);
        let posts = [];
        const f = {
                t: "",
                y: "",
                q: "",
                status: "",
                order: "newest"
            },
            $ = s => document.querySelector(s);
        const MAJOR_LABELS = {
            cs: "علوم الحاسب",
            ai: "الذكاء الاصطناعي",
            is: "نظم المعلومات"
        };
        const esc = s => String(s).replace(/[&<>"']/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[c]));

        function toast(m) {
            const t = $("#toast");
            t.textContent = m;
            t.style.display = "block";
            clearTimeout(toast.h);
            toast.h = setTimeout(() => t.style.display = "none", 2500)
        }

        function contactBtn(p) {
            const c = String(p.contact || "").trim();
            const digits = c.replace(/\D/g, "");
            let method = "نص للتواصل";
            let action = `<button class="b" data-copy="${esc(c)}">نسخ وسيلة التواصل</button>`;
            if (/^https?:\/\//i.test(c)) {
                let host = "";
                try {
                    host = new URL(c).hostname.toLowerCase();
                } catch (e) {}
                method = host.includes("t.me") ? "تيليجرام" : host.includes("wa.me") || host.includes("whatsapp") ? "واتساب" : "رابط";
                action = `<a class="b" href="${esc(c)}" target="_blank" rel="noopener noreferrer">تواصل عبر ${method}</a>`;
            } else if (/^[+\d\s-]{8,}$/.test(c)) {
                method = "واتساب";
                action = `<a class="b" href="https://wa.me/${digits.replace(/^0/, "20")}" target="_blank" rel="noopener noreferrer">تواصل عبر واتساب</a>`;
            }
            return `<span class="contact-method"><small class="contact-method__label">وسيلة التواصل: ${method}</small>${action}</span>`;
        }

        function render() {
            const q = f.q.trim().toLowerCase();
            const rows = posts.filter(p => {
                const text = [p.subject, p.role, p.desc, p.name].join(" ").toLowerCase();
                const statusMatches = !f.status || (f.status === "open" ? !p.closed : p.closed);
                return (!f.t || p.type === f.t) && (!f.y || p.year === f.y) && statusMatches && (!q || text.includes(q));
            }).sort((a, b) => (a.closed - b.closed) || (f.order === "oldest" ? a.at - b.at : b.at - a.at));
            $("#cnt").textContent = `${rows.length} من ${posts.length} طلب`;
            $("#list").innerHTML = rows.length ? rows.map(p => {
                        const mine = p.uid === ME.id,
                            need = p.type === "need";
                        return `<article class="card ${p.closed?"closed":""}">
      <span class="tag ${p.closed?"cl":need?"need":"have"}">${p.closed?"اكتمل":need?"محتاج تيم":"معاه تيم ومحتاج أعضاء"}</span>
      <h3>${esc(p.subject)}</h3>
    <div class="chips"><span>🎯 ${esc(p.role)}</span><span>🎓 السنة ${esc(p.year)}</span>${p.major?`<span>📚 ${esc(MAJOR_LABELS[p.major]||p.major)}</span>`:""}<span>👥 ${need?`تيم من ${p.count} أفراد`:`محتاجين ${p.count} أعضاء`}</span></div>
      ${p.desc?`<p>${esc(p.desc)}</p>`:""}
    <div class="foot"><span class="mut">${esc(p.name)} • ${new Date(p.at).toLocaleDateString("ar-EG")}</span>
    <div class="card__actions">${p.closed?"":contactBtn(p)}${mine?`${p.closed?"":`<button class="b" data-done="${p.id}">اكتمل</button>`}<button class="b" data-del="${p.id}">حذف</button>`:""}</div></div></article>`}).join("")
   :`<div class="empty" style="grid-column:1/-1">مفيش طلبات مطابقة حاليًا. كن أول واحد يضيف طلب! 🚀</div>`;
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-copy]"); if(c){navigator.clipboard&&navigator.clipboard.writeText(c.dataset.copy);return toast("تم نسخ وسيلة التواصل")}
  const d=e.target.closest("[data-del]"); if(d){if(confirm("حذف الطلب؟")){api("DELETE","/api/teams/"+d.dataset.del).then(()=>{posts=posts.filter(p=>p.id!==d.dataset.del);render()}).catch(x=>toast(x.message))}return}
  const k=e.target.closest("[data-done]"); if(k){const p=posts.find(p=>p.id===k.dataset.done);if(p){api("PATCH","/api/teams/"+p.id).then(()=>{p.closed=true;render()}).catch(x=>toast(x.message))}}
});
$("#ft").onchange=e=>{f.t=e.target.value;render()}; $("#fy").onchange=e=>{f.y=e.target.value;render()}; $("#fs").onchange=e=>{f.status=e.target.value;render()}; $("#fo").onchange=e=>{f.order=e.target.value;render()}; $("#fq").oninput=e=>{f.q=e.target.value;render()};
$("#clearFilters").onclick=()=>{Object.assign(f,{t:"",y:"",q:"",status:"",order:"newest"});["#ft","#fy","#fs","#fq"].forEach(s=>$(s).value="");$("#fo").value="newest";render()};
const dlg=$("#dlg"), frm=$("#frm");
$("#add").onclick=()=>{frm.reset();$("#err").textContent="";sync();dlg.showModal()};
$("#cancel").onclick=()=>dlg.close();
function sync(){const need=frm.type.value==="need",needsMajor=["الثالثة","الرابعة"].includes(frm.elements.year.value),majorField=$("#majorField"),majorSelect=$("#majorSelect");$("#cntLbl").textContent=need?"عدد أفراد التيم المطلوب":"عدد الأعضاء اللي محتاجهم";$("#roleHint").textContent=need?"(اللي إنت بتعرف تعمله)":"(الدور المطلوب في التيم)";majorField.hidden=!needsMajor;majorSelect.disabled=!needsMajor;majorSelect.required=needsMajor;if(!needsMajor)majorSelect.value=""}
frm.addEventListener("change",sync);
frm.addEventListener("submit",e=>{
  e.preventDefault();
  const v=Object.fromEntries(new FormData(frm));
  if(!v.subject.trim()||!v.role.trim()||!v.contact.trim()){$("#err").textContent="املأ الحقول المطلوبة.";return}
    if(["الثالثة","الرابعة"].includes(v.year)&&!v.major){$("#err").textContent="اختر التخصص للسنة الثالثة أو الرابعة.";return}
    api("POST","/api/teams",{type:v.type,subject:v.subject.trim(),role:v.role.trim(),year:v.year,major:v.major||"",count:v.count,desc:(v.desc||"").trim(),contact:v.contact.trim()})
    .then(p=>{posts.unshift(p);dlg.close();render();toast("تم نشر طلبك ✅")})
    .catch(x=>{$("#err").textContent=x.message});
});
api("GET","/api/teams").then(l=>{posts=l;render()}).catch(x=>{render();toast(x.message)});
    </script>
    <script src="script.js?v=20261008"></script>
    <script src="page.js"></script>
    <script src="mobile.js"></script>
